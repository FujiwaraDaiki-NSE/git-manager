<!doctype html><html lang="ja"><meta charset="utf-8"><title>合流矢印の整理</title><style>body{max-width:760px;margin:48px auto;padding:0 24px;font:16px/1.8 system-ui;color:#182d40}h1{font-size:28px}</style><h1>合流矢印の重なり改善</h1><p>同じ時刻付近の合流が重なるため、線の途中に専用の通過位置を設けました。重なるブランチ区間では16px間隔を確保し、方向を示す矢印を終点から線の途中へ移動しています。</p><p>線の両端は従来の合流日時を表し、迂回部分は時刻を表しません。ブランチを選ぶと関係する線を強調します。合流関係やコミットは省略していません。</p><p>SVGの横座標と経路計算を実ピクセル幅に統一し、狭い画面でも線の間隔を維持します。密集・端点・上下方向・順序安定性を含む31件のテストを確認しています。</p></html>
